name: CI - Build, Scout & Push

# Le workflow se déclenche à chaque push sur la branche main
on:
  push:
    branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest

    # Nom complet de l'image : <ton-login-dockerhub>/voting-app:latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/voting-app:latest

    steps:
      # 1. Récupère le code du dépôt
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Connexion à Docker Hub (utilise les secrets du dépôt)
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build de l'image à partir du Dockerfile
      - name: Docker build
        run: docker build -t "$IMAGE" .

      # 4. Analyse des vulnérabilités avec Docker Scout
      #    exit-code: false => le workflow ne plante pas s'il trouve des CVE
      - name: Docker scout (scan CVE)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE }}
          only-severities: critical,high
          exit-code: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Envoi de l'image sur Docker Hub
      - name: Docker push
        run: docker push "$IMAGE"
