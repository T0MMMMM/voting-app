services:
  voting-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting-app
    ports:
      - "8080:80"
    environment:
      REDIS: "redis"
      REDIS_PWD: "votingapppwd"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voting-net

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass votingapppwd
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "votingapppwd", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - voting-net

networks:
  voting-net:
    driver: bridge
